[workspace]
resolver = "2"
members = ["diwan", "diwan-lib"]
default-members = ["diwan"]
[build]
rustflags = ["-A", "dead_code"]
[profile.release]
lto = "thin"

[profile.dev]
lto = "off"
panic = "unwind"
incremental = true

[profile.test]
lto = "off"
# panic = "unwind"

[profile.opt]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3

[workspace.package]
version = "1.0.0-2"
edition = "2021"
authors = ["Tarik", "Makarov", "Abdogouhmad"]
categories = ["editor"]
description = "A unique rust editor"
repository = "https://github.com/Diwan-editor/Diwan"
homepage = "https://github.com/Diwan-editor/Diwan"
license = "MPL-2.0"
rust-version = "1.80.1"
